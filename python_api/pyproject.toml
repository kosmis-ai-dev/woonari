[project]
name = "unse-api"
version = "0.1.0"
description = "Original tb_manse-backed saju calculations and AI fortune interpretation"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0", "uvicorn==0.54.0", "pydantic==2.14.2",
  "pydantic-settings==2.16.2", "openai==3.42.1",
  "PyMySQL==1.2.1", "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.json", "data/*.sqlite3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
